name: sisupal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- YOUR PACKAGES ---
  syncfusion_flutter_pdfviewer: ^28.2.9
  cupertino_icons: ^1.0.8
  flutter_tts: ^3.8.5
  audioplayers: ^6.0.0
  confetti: ^0.7.0
  youtube_player_flutter: ^9.0.1
  pdf: ^3.11.3
  printing: ^5.11.1
  image_picker: ^1.0.4
  firebase_storage: ^12.4.10
  lottie: ^3.1.0

  intl: ^0.19.0

  url_launcher: ^6.2.4

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # UI & State
  google_fonts: ^8.0.2
  provider: ^6.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/games/
    - assets/pdfs/
